name: Verify
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run check
      - run: npm test
      - run: python3 tests/database.py
      - run: npm run build
      - run: npm run db:local
      - run: npx playwright install --with-deps chromium
      - run: node tests/run-integration.mjs
